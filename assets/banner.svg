<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="40%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-18px) scale(1.15); opacity: 0.7; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    @keyframes pulseOrb {
      0% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.2); opacity: 0.45; }
      100% { transform: scale(1); opacity: 0.25; }
    }
    @keyframes pageTurn {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(-20deg); }
      100% { transform: rotateY(0deg); }
    }
    @keyframes borderPulse {
      0% { stroke-opacity: 0.25; }
      50% { stroke-opacity: 0.65; }
      100% { stroke-opacity: 0.25; }
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; transform-origin: center; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; transform-origin: center; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 3s; transform-origin: center; }
    .orb-pulse { animation: pulseOrb 10s ease-in-out infinite; transform-origin: 950px 180px; }
    .card-border { animation: borderPulse 4s ease-in-out infinite; }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Glowing Accent Orbs (Deep in background) -->
  <circle cx="150" cy="80" r="140" fill="#00d2ff" opacity="0.12" filter="url(#glow)" />
  <circle cx="950" cy="180" r="180" fill="#11998e" opacity="0.18" class="orb-pulse" filter="url(#glow)" />
  <circle cx="1080" cy="320" r="120" fill="#ff758c" opacity="0.1" filter="url(#glow)" />

  <!-- Dynamic / Floating Ambient Elements in Background -->
  <g class="particle-1">
    <circle cx="180" cy="330" r="4" fill="#38ef7d" opacity="0.6" />
    <circle cx="1020" cy="80" r="5" fill="#00d2ff" opacity="0.6" />
    <circle cx="680" cy="50" r="3" fill="#ffffff" opacity="0.4" />
  </g>
  <g class="particle-2">
    <circle cx="280" cy="60" r="6" fill="#ff7eb3" opacity="0.5" />
    <circle cx="890" cy="360" r="4" fill="#38ef7d" opacity="0.5" />
    <circle cx="540" cy="380" r="3.5" fill="#00d2ff" opacity="0.4" />
  </g>
  <g class="particle-3">
    <circle cx="70" cy="220" r="3" fill="#ffffff" opacity="0.5" />
    <circle cx="1130" cy="240" r="4" fill="#38ef7d" opacity="0.6" />
  </g>

  <!-- Abstract Book / Reader Device Illustration in Right Half (Safe Distance from Text) -->
  <g transform="translate(860, 90)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="220" height="250" rx="18" fill="url(#cardGrad)" stroke="#38ef7d" stroke-width="1.5" class="card-border" />
    <!-- Screen -->
    <rect x="14" y="16" width="192" height="218" rx="10" fill="#070e1e" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <!-- Book Spine & Open Pages Inside Device -->
    <path d="M 35 60 Q 110 50 110 190 Q 35 180 35 60 Z" fill="#ffffff" fill-opacity="0.06" stroke="#00d2ff" stroke-width="1" />
    <path d="M 185 60 Q 110 50 110 190 Q 185 180 185 60 Z" fill="#ffffff" fill-opacity="0.09" stroke="#38ef7d" stroke-width="1" />
    <!-- Center Crease -->
    <line x1="110" y1="46" x2="110" y2="194" stroke="#38ef7d" stroke-width="2" opacity="0.8" />
    <!-- Stylized Reading Lines Left Page -->
    <line x1="48" y1="80" x2="98" y2="78" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
    <line x1="48" y1="100" x2="95" y2="98" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
    <line x1="48" y1="120" x2="98" y2="118" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
    <line x1="48" y1="140" x2="88" y2="138" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
    <!-- Stylized Reading Lines Right Page -->
    <line x1="122" y1="78" x2="172" y2="80" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
    <line x1="122" y1="98" x2="168" y2="100" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
    <line x1="122" y1="118" x2="172" y2="120" stroke="#38ef7d" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" />
    <line x1="122" y1="138" x2="162" y2="140" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND TEXT SECTION (Protected & Crystal Clear) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge / Pill -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="url(#cardGrad)" stroke="#38ef7d" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38ef7d" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38ef7d" letter-spacing="1">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Digital Document
    </text>
    <text x="0" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      &amp; E-Book Reader Ecosystem
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Top SaaS Platforms &amp; Open-Source Software for PDF, EPUB, Comic &amp; Library Management
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 280)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="125" height="32" rx="8" fill="#1c2541" stroke="#3b82f6" stroke-width="1" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">📄 PDF Viewers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(137, 0)">
        <rect x="0" y="0" width="130" height="32" rx="8" fill="#1c2541" stroke="#10b981" stroke-width="1" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">📖 EPUB &amp; Sync</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(279, 0)">
        <rect x="0" y="0" width="145" height="32" rx="8" fill="#1c2541" stroke="#f59e0b" stroke-width="1" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fcd34d">📚 Library Servers</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(436, 0)">
        <rect x="0" y="0" width="165" height="32" rx="8" fill="#1c2541" stroke="#ec4899" stroke-width="1" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f472b6">🔒 Privacy &amp; Offline</text>
      </g>
    </g>
  </g>
</svg>
